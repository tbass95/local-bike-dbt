version: 2

models:
  - name: stg_orders
    description: "Commandes clients nettoyées"
    columns:
      - name: order_id
        description: "ID unique de commande"
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: store_id
        tests:
          - not_null

  - name: stg_order_items
    description: "Lignes de commande avec calculs de revenus"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: quantity
        tests:
          - not_null

  - name: stg_products
    description: "Catalogue produits"
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: stg_customers
    description: "Clients"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_stores
    description: "Magasins"
    columns:
      - name: store_id
        tests:
          - unique
          - not_null

  - name: stg_staffs
    description: "Employés"
    columns:
      - name: staff_id
        tests:
          - unique
          - not_null

  - name: stg_brands
    columns:
      - name: brand_id
        tests:
          - unique
          - not_null

  - name: stg_categories
    columns:
      - name: category_id
        tests:
          - unique
          - not_null
